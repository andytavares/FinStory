name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npx electron-builder install-app-deps
      - run: npm run verify
