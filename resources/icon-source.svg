<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2843"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d8bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#96a8d6" stroke-opacity="0.18" stroke-width="2"/>
  <g stroke="#96a8d6" stroke-opacity="0.12" stroke-width="4">
    <line x1="220" y1="400" x2="804" y2="400"/>
    <line x1="220" y1="540" x2="804" y2="540"/>
    <line x1="220" y1="680" x2="804" y2="680"/>
  </g>
  <path d="M220 700 L370 600 L480 650 L620 470 L780 340 L780 800 L220 800 Z" fill="url(#area)"/>
  <polyline points="220,700 370,600 480,650 620,470 780,340" fill="none" stroke="#6d8bff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.7"/>
  <polyline points="220,700 370,600 480,650 620,470 780,340" fill="none" stroke="#8ea6ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="780" cy="340" r="44" fill="#eef1f8"/>
  <circle cx="780" cy="340" r="22" fill="#6d8bff"/>
</svg>
